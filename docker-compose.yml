version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=production-secure-key-investiq-2026-deploy
      - PORT=5000
    volumes:
      - ./backend/investment_app.db:/app/backend/investment_app.db
